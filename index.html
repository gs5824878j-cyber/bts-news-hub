<title>BTS NEWS HUB</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f5f6fa;color:#171923}
header{position:sticky;top:0;z-index:10;background:#111827;color:#fff;padding:14px 14px 12px;box-shadow:0 2px 12px #0002}
h1{font-size:21px;margin:0 0 4px}.sub{font-size:12px;color:#cbd5e1}
.wrap{max-width:900px;margin:auto}.tabs{display:flex;gap:7px;overflow:auto;padding:12px 0 4px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{border:0;border-radius:999px;background:#fff;padding:9px 14px;white-space:nowrap;font-weight:700;color:#374151}.tab.active{background:#111827;color:#fff}
.controls{display:flex;gap:8px;margin:10px 0}.controls input,.controls select{flex:1;min-width:0;border:1px solid #d1d5db;border-radius:12px;padding:11px;background:#fff;font-size:14px}
main{padding:0 14px 30px}.status{font-size:12px;color:#6b7280;margin:10px 0}
.card{background:#fff;border-radius:16px;padding:15px;margin:10px 0;box-shadow:0 1px 5px #00000010;border:1px solid #eee}
.badge{display:inline-block;font-size:11px;font-weight:700;background:#eef2ff;color:#4338ca;padding:4px 8px;border-radius:999px;margin-bottom:7px}
.card h2{font-size:17px;line-height:1.45;margin:0 0 8px}.meta{font-size:12px;color:#6b7280}.desc{font-size:13px;line-height:1.55;color:#4b5563;margin:9px 0}
.card a{display:inline-block;color:#4f46e5;text-decoration:none;font-weight:700;font-size:13px;padding-top:3px}
.empty{padding:40px 10px;text-align:center;color:#6b7280}
footer{text-align:center;color:#9ca3af;font-size:11px;padding:10px 0 30px}
@media(min-width:700px){.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{margin:0}.controls{max-width:650px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>💜 BTS NEWS HUB</h1><div class="sub">BTSの最新ニュースをメンバー別にチェック</div></div></header>
<div class="wrap">
<nav class="tabs" id="tabs"></nav>
<main>
<div class="controls"><input id="search" placeholder="ニュースを検索…"><select id="period"><option value="all">すべて</option><option value="7">7日以内</option><option value="30">30日以内</option></select></div>
<div class="status" id="status"></div>
<div class="grid" id="news"></div>
<footer>BTS NEWS HUB / News links belong to their respective publishers.</footer>
</main></div>
<script>
const members=["ALL","RM","JIN","SUGA","J-HOPE","JIMIN","V","JUNG KOOK"];
let news=[];
const tabs=document.getElementById("tabs"), newsEl=document.getElementById("news"), search=document.getElementById("search"), period=document.getElementById("period"), status=document.getElementById("status");
let current=["ALL"];

members.forEach(m=>{
 const b=document.createElement("button");
 b.className="tab"+(m==="ALL"?" active":"");
 b.textContent=m;

 b.onclick=()=>{
   if(m==="ALL"){
     current=["ALL"];
   }else{
     current=current.filter(x=>x!=="ALL");

     if(current.includes(m)){
       current=current.filter(x=>x!==m);
     }else{
       current.push(m);
     }

     if(!current.length){
       current=["ALL"];
     }
   }

   document.querySelectorAll(".tab").forEach(x=>{
     x.classList.toggle("active",current.includes(x.textContent));
   });

   render();
 };

 tabs.appendChild(b);
});

function render(){
 const q=search.value.toLowerCase(),
       days=period.value==="all"?9999:+period.value,
       now=new Date();

 let list=news
 .filter(n=>current.includes("ALL") ? true : current.includes(n.m))
 .filter(n=>n.t.toLowerCase().includes(q)||n.x.toLowerCase().includes(q)||n.s.toLowerCase().includes(q))
 .filter(n=>(now-new Date(n.d+"T00:00:00+09:00"))/86400000<=days)
 .sort((a,b)=>b.d.localeCompare(a.d));

 status.textContent=`${current.includes("ALL")?"BTS全体":current.join(" + ")}　${list.length}件`;
 newsEl.innerHTML=list.length?list.map(n=>`<article class="card"><span class="badge">${n.m}</span><h2>${esc(n.t)}</h2><div class="meta">${n.s} ・ ${n.d}</div><div class="desc">${esc(n.x)}</div><a href="${n.u}" target="_blank" rel="noopener">記事を読む →</a></article>`).join(""):`<div class="empty">該当するニュースがありません。</div>`;
}
function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
search.oninput=render;
period.onchange=render;

async function loadNews(){
  status.textContent="ニュースを読み込み中…";
  try{
    const res=await fetch(`news.json?v=${Date.now()}`,{cache:"no-store"});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    news=await res.json();
    render();
  }catch(err){
    console.error(err);
    status.textContent="ニュースの読み込みに失敗しました。少し時間をおいて再読み込みしてください。";
    newsEl.innerHTML='<div class="empty">ニュースを取得できませんでした。</div>';
  }
}

loadNews();

if("serviceWorker" in navigator){
  window.addEventListener("load", async ()=>{
    try{
      const reg = await navigator.serviceWorker.register("sw.js?v=5", {updateViaCache:"none"});
      await reg.update();
    }catch(e){
      console.error("Service Worker update failed", e);
    }
  });
}
</script>
</body></html>
